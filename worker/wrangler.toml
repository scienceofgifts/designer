name = "designdna-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"

# Optional environment variables (non-secret)
[vars]
GEMINI_MODEL = "gemini-2.5-flash"
# Configure ALLOWED_ORIGINS to restrict CORS to your production GitHub Pages domain
# e.g.: ALLOWED_ORIGINS = "https://your-username.github.io,http://localhost:3000,http://localhost:5173"

# Note: GEMINI_API_KEY must be stored securely as a Cloudflare Secret:
# Run: npx wrangler secret put GEMINI_API_KEY
